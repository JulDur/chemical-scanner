<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2557d6"><link rel="manifest" href="./manifest.webmanifest"><title>Chemical Scanner</title><link rel="stylesheet" href="./styles.css"></head><body><main><header><div class="mark">⚗</div><div><h1>Chemical Scanner</h1><p>Offline label OCR</p></div></header><section class="content"><label><span>Session</span><input id="session" value="Lab inventory"></label><div id="home"><button id="camera" class="primary big">📷 Photograph container</button><input id="photo" hidden type="file" accept="image/*" capture="environment"><button id="manual">＋ Enter manually</button><div class="title"><h2>Current inventory</h2><small id="count">0 containers</small></div><div id="list"></div><div id="exports" class="actions hidden"><button id="download">Download CSV</button><button id="share" class="share">Share</button></div></div><div id="editor" class="card hidden"><h2>Check container</h2><div id="status" class="status hidden"></div><progress id="progress" max="100" value="0" class="hidden"></progress><label><span>Chemical name</span><input data-field="name" placeholder="e.g. Acetone"></label><label><span>CAS number</span><input data-field="cas" placeholder="e.g. 67-64-1"></label><small id="casState"></small><label><span>Article number</span><input data-field="article"></label><label><span>Lot / batch</span><input data-field="lot"></label><label><span>Manufacturer</span><input data-field="manufacturer"></label><label><span>Amount</span><input data-field="amount" placeholder="e.g. 2.5 L"></label><details id="rawBox" class="hidden"><summary>Raw OCR text</summary><pre id="raw"></pre></details><div class="actions"><button id="cancel">Cancel</button><button id="add" class="primary">Add container</button></div></div></section></main><script src="./ocr/tesseract.min.js"></script><script src="./app.js"></script></body></html>
